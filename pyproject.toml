[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aio-podcast"
version = "0.1.0"
description = "Typed asynchronous podcast feed client"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["aiohttp>=3.11"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/armilancode/aio-podcast"
Issues = "https://github.com/armilancode/aio-podcast/issues"

[dependency-groups]
dev = [
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "pytest-cov>=6.2",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiopodcast"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["aiopodcast"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.mypy]
strict = true
packages = ["aiopodcast"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

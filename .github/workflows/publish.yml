name: Publish

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade build mypy pytest pytest-asyncio pytest-cov ruff twine
      - run: python -m pip install -e .
      - run: python -m ruff check .
      - run: python -m mypy --strict src/aiopodcast
      - run: python -m pytest --cov=aiopodcast --cov-branch --cov-report=term-missing
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$RELEASE_TAG" = "v$package_version"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
